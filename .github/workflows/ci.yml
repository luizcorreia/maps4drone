name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e ".[dev,web]"
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/mypy
      - run: .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  webodm-compat:
    # WebODM runs Python 3.9 with pydantic 1.x: the planner must work on that stack, no FastAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.9
      - run: uv pip install -e . "pydantic==1.10.8" "pillow>=10.1" "rasterio>=1.3,<1.4" "pytest>=8"
      - run: .venv/bin/pytest -q tests --ignore=tests/test_web.py --ignore=tests/test_dji.py --ignore=tests/test_qgis_plugin.py
